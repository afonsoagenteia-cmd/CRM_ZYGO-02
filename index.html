<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZYGO CRM v2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g:#063a20;--g2:#0b5230;--l:#c5dc3a;--bg:#f5f7f2;--t:#14281d;--m:#6d7f74;--bd:#e4e9df;--r:#c0392b;--sh:0 1px 2px #0a2a1a14,0 4px 14px #0a2a1a0a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:var(--bg);-webkit-font-smoothing:antialiased}
#app{display:flex;min-height:100vh}aside{width:224px;flex:none;background:var(--g);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.lo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-size:18px;font-weight:700;letter-spacing:.02em}.lo i{width:32px;height:32px;border-radius:9px;background:var(--l);color:var(--g);display:grid;place-items:center;font-style:normal;font-weight:800}.lo small{display:block;font-size:10px;font-weight:500;color:#ffffff8c;letter-spacing:.14em}
.nv{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#cfe3d6;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500}.nv:hover{background:#ffffff14;color:#fff}.nv.on{background:var(--l);color:var(--g);font-weight:700}.nv svg{width:18px;height:18px;flex:none}
.us{margin-top:auto;border-top:1px solid #ffffff1f;padding-top:14px}.me{display:flex;gap:10px;align-items:center;padding:0 6px 10px}.av{width:34px;height:34px;border-radius:50%;background:var(--l);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}.me b{display:block;font-size:13px;line-height:1.2}.me small{color:#ffffff99}
main{flex:1;min-width:0;padding:28px 32px;max-width:1280px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h2{margin:0;font-size:24px;letter-spacing:-.01em;color:var(--g)}h2 small{font-size:14px;color:var(--m);font-weight:500;margin-left:6px}h3{font-size:15px;margin:0 0 12px;color:var(--g)}h4{margin:14px 0 4px;color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{font:inherit;height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;width:100%;color:var(--t)}textarea{height:auto;padding:10px 12px}header input{width:240px}header select{width:auto}input:focus,select:focus,textarea:focus{outline:2px solid #c5dc3a99;border-color:var(--g2)}
.b{height:40px;background:var(--l);color:var(--g);border:0;padding:0 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.b:hover{filter:brightness(.95)}.b.g{background:#fff;border:1px solid var(--bd);color:var(--t);font-weight:600}.b.s{height:30px;padding:0 11px;font-size:12px}.b:disabled{opacity:.5}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:18px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi{display:flex;flex-direction:column;gap:2px}.kpi>small:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}.kpi b{font-size:26px;line-height:1.2;color:var(--g)}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}
.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.bar .tk{background:#eef3e6;border-radius:99px;height:8px;overflow:hidden}.bar i{display:block;height:8px;border-radius:99px;background:var(--l)}.bar b{text-align:right}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);overflow:hidden;table-layout:fixed}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--m);text-align:left;padding:12px 14px;background:#fafbf8;border-bottom:1px solid var(--bd)}td{padding:12px 14px;border-bottom:1px solid #eef1ea;vertical-align:middle;overflow:hidden}tbody tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#f6faea}td b,td small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--m)}
.ch{display:inline-flex;align-items:center;background:#eef3e6;color:var(--g);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;margin:2px 4px 2px 0}td .ch{max-width:150px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.rd{background:#fde8e5;color:var(--r)}.gr{background:#dff3e3;color:#13693a}.am{background:#fff1c9;color:#8a6100}.bl{background:#e3eefb;color:#1b4f8f}.gy{background:#eceeea;color:#58665d}
.wa{display:inline-flex;background:#e6f7ec;color:#13693a;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;text-decoration:none}.wa:hover{background:#d3f0de}
.kb{display:flex;gap:12px;overflow:auto;align-items:flex-start;padding-bottom:10px}.col{flex:0 0 250px;background:#ebf0e4;border-radius:14px;padding:10px;min-height:140px}.col h4{margin:2px 4px 6px;display:flex;justify-content:space-between;align-items:center}.kc{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;cursor:grab;box-shadow:var(--sh)}.kc:hover{border-color:var(--g2)}
#dr{position:fixed;right:0;top:0;bottom:0;width:min(580px,100%);background:#fff;box-shadow:-10px 0 40px #0a2a1a33;padding:22px;overflow:auto;display:none;z-index:5}
.tabs{display:flex;gap:4px;margin:14px 0;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:10px}.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;color:var(--m)}.tabs .on{background:var(--g);color:#fff}
.it{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;margin:12px 0;align-items:start}.kv>span{color:var(--m);font-size:13px}
.ov{position:fixed;inset:0;background:#0a2a1a73;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}.mc{background:#fff;border-radius:16px;padding:22px;width:min(500px,100%);max-height:92vh;overflow:auto}
.fl{display:block;margin:12px 0;font-size:12px;font-weight:600;color:var(--m)}.fl>*{margin-top:5px;font-weight:400;color:var(--t)}.mu{display:grid;gap:6px;max-height:190px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:10px}.mu label{display:flex;gap:8px;align-items:center;font-size:13px}.mu input{width:auto;height:auto}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.lg{margin:auto;width:min(360px,92%);padding:32px}.lg form{display:grid;gap:12px}.lg h1{color:var(--g);margin:0 0 6px}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20}#ts div{background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;margin-top:6px;box-shadow:var(--sh)}#ts .e{background:var(--r)}
@media(max-width:860px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}.lo{padding:0 8px}.nv{width:auto;padding:8px 10px}.us{margin:0 0 0 auto;border:0;padding:0}.me{display:none}main{padding:16px}td:nth-child(n+4),th:nth-child(n+4){display:none}.bar{grid-template-columns:100px 1fr 24px}}
</style></head><body><div id="app"></div>
<script>
const SB_URL='https://taeavxdlfbgtevadugnk.supabase.co',SB_KEY='sb_publishable_xT9fTOhuFbSNNFjYkPJIEA__Olfg6tv';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ETAPAS=['Novo Lead','Em Qualificação','MQL Qualificado (SQL)','Reunião de Diagnóstico Agendada','Proposta Comercial Enviada','Negociação / Ajustes','Ganho','Perdido'];
const ORIG0=['Website','LinkedIn','Instagram','Facebook','Evento','Indicação','Google Ads'];
const S={view:'dash',q:'',fe:'',users:[],servicos:[],origens:ORIG0};let CUR={};
const fd=d=>d?new Date(d).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'}):'—';
const kz=n=>new Intl.NumberFormat('pt-PT').format(n||0)+' Kz';
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#ts').appendChild(d);setTimeout(()=>d.remove(),3500)}
async function q(p){const{data,error}=await p;if(error){toast(error.message,1);throw error}return data}
const wa=t=>t?`<a class="wa" href="https://wa.me/${h(t.replace('+',''))}" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>`:''
const IC={dash:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',leads:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 21c0-4 3-6 7-6s7 2 7 6M17 4a3.5 3.5 0 0 1 0 7M22 21c0-3-1.5-5-4-5.7',pipe:'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v6h-4z',clientes:'M4 21V6l8-3 8 3v15zM9 21v-5h6v5',hoje:'M20 6L9 17l-5-5',admin:'M4 7h16M4 12h16M4 17h16M9 5v4M15 10v4M8 15v4',sair:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const SC={'Novo Lead':['bl','Novo'],'Em Qualificação':['am','Em qualificação'],'MQL Qualificado (SQL)':['am','Qualificado'],'Reunião de Diagnóstico Agendada':['bl','Diagnóstico'],'Proposta Comercial Enviada':['bl','Proposta'],'Negociação / Ajustes':['bl','Negociação'],'Ganho':['gr','Ganho'],'Perdido':['gy','Perdido']};
const st=e=>{const[c,t]=SC[e]||['',e];return`<span class="ch ${c}" title="${h(e)}">${h(t)}</span>`};
const own=l=>(S.users.find(u=>u.id==l.proprietario_id)||{}).full_name||l.proprietario||'—';
const sla=l=>(l.primeira_resposta_em||['Ganho','Perdido'].includes(l.pipeline_stage))?null:Math.round((Date.now()-new Date(l.data_entrada))/36e5);

/* ---------- arranque / login ---------- */
async function init(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const me=await q(sb.from('users').select('*').eq('id',session.user.id));S.me=me[0];
 if(!S.me||!S.me.ativo){$('#app').innerHTML='<div class="lg"><h1>Sem acesso</h1><p>Esta conta não está activa no CRM.</p><button class="b" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</button></div>';return}
 const ok=p=>p.then(r=>r.error?null:r.data);
 S.users=await q(sb.from('users').select('id,full_name,role').eq('ativo',true).order('full_name'));
 S.servicos=(await ok(sb.from('servicos').select('*').eq('ativo',true).order('ordem')))||[];
 const o=await ok(sb.from('origens').select('nome').eq('ativo',true).order('ordem'));if(o&&o.length)S.origens=o.map(x=>x.nome);
 go(S.view)}
function login(){$('#app').innerHTML=`<div class="lg"><form onsubmit="return doLogin(event)"><h1>ZYGO CRM</h1><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Palavra-passe" required><button class="b">Entrar</button><small id="le"></small></form></div>`}
async function doLogin(e){e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)$('#le').textContent='Credenciais inválidas';else init();return false}
function shell(c){const n=[['dash','Dashboard'],['leads','Leads'],['pipe','Pipeline'],['clientes','Clientes'],['hoje','Hoje']].concat(adm()?[['admin','Admin']]:[]);
 return`<aside><div class="lo"><i>Z</i><div>ZYGO<small>CRM V2</small></div></div>${n.map(([v,t])=>`<button class="nv ${S.view==v?'on':''}" onclick="go('${v}')">${ic(v)}${t}</button>`).join('')}<div class="us"><div class="me"><span class="av">${h((S.me.full_name||'?').slice(0,2).toUpperCase())}</span><div><b>${h(S.me.full_name)}</b><small>${h(S.me.role)}</small></div></div><button class="nv" onclick="sb.auth.signOut().then(()=>location.reload())">${ic('sair')}Sair</button></div></aside><main>${c}</main><div id="dr"></div><div id="md"></div><div id="ts"></div>`}
function go(v){S.view=v;closeDr();({dash:viewDash,leads:viewLeads,pipe:viewPipe,clientes:viewClientes,hoje:viewHoje,admin:viewAdmin})[v]()}
function closeDr(){const d=$('#dr');if(d)d.style.display='none'}

/* ---------- modal genérico ---------- */
function fld(f){const i=`id="f_${f.k}"`;let c;
 if(f.t=='select')c=`<select ${i}>${f.r?'':'<option value=""></option>'}${f.o.map(([v,l])=>`<option value="${h(v)}" ${v==f.v?'selected':''}>${h(l)}</option>`).join('')}</select>`;
 else if(f.t=='area')c=`<textarea ${i} rows="3">${h(f.v)}</textarea>`;
 else if(f.t=='multi')c=`<div ${i} class="mu">${f.o.map(([v,l])=>`<label><input type="checkbox" value="${h(v)}">${h(l)}</label>`).join('')}</div>`;
 else c=`<input ${i} type="${f.t||'text'}" value="${h(f.v)}">`;
 return`<div class="fl">${h(f.l)}${f.r?' *':''}${c}</div>`}
function modal(title,fields,ok){
 $('#md').innerHTML=`<div class="ov"><div class="mc"><h3>${h(title)}</h3>${fields.map(fld).join('')}<div class="ac"><button class="b g" onclick="$('#md').innerHTML=''">Cancelar</button><button class="b" id="mk">Guardar</button></div></div></div>`;
 $('#mk').onclick=async()=>{const v={};
  for(const f of fields){const e=$('#f_'+f.k);v[f.k]=f.t=='multi'?[...e.querySelectorAll('input:checked')].map(i=>i.value):(e.value===''?null:e.value);
   if(f.r&&(v[f.k]==null||v[f.k].length==0))return toast('Preencha: '+f.l,1)}
  $('#mk').disabled=true;try{await ok(v);$('#md').innerHTML=''}catch(e){$('#mk').disabled=false}}}

/* ---------- LEADS ---------- */
async function viewLeads(){
 if(S.view=='pipe')return viewPipe();
 $('#app').innerHTML=shell(`<header><h2>Leads <small id="cn"></small></h2><div class="tb" style="display:flex;gap:8px;flex-wrap:wrap"><input placeholder="Pesquisar…" value="${h(S.q)}" oninput="S.q=this.value;rowsL()"><select onchange="S.fe=this.value;rowsL()"><option value="">Todas as etapas</option>${ETAPAS.map(e=>`<option ${e==S.fe?'selected':''}>${e}</option>`).join('')}</select><button class="b g" onclick="csv()">CSV</button><button class="b" onclick="newLead()">+ Novo lead</button></div></header><table><thead><tr><th style="width:24%">Lead</th><th style="width:27%">Serviços</th><th style="width:14%">Etapa</th><th style="width:15%">Responsável</th><th style="width:9%">SLA</th><th style="width:11%">Contacto</th></tr></thead><tbody id="tb"><tr><td colspan="6">A carregar…</td></tr></tbody></table>`);
 S.leads=await q(sb.from('leads').select('*,lead_servicos(servicos(nome))').is('deleted_at',null).order('created_at',{ascending:false}));rowsL()}
const svc=l=>{const a=(l.lead_servicos||[]).map(x=>x.servicos?.nome).filter(Boolean);if(!a.length)return h(l.servico_interesse);return a.slice(0,2).map(n=>`<span class="ch" title="${h(n)}">${h(n)}</span>`).join('')+(a.length>2?`<span class="ch gy" title="${h(a.slice(2).join(', '))}">+${a.length-2}</span>`:'')}
function rowsL(){const t=S.q.toLowerCase();
 const L=S.leads.filter(l=>(!S.fe||l.pipeline_stage==S.fe)&&`${l.nome_completo} ${l.empresa} ${l.email} ${l.telefone}`.toLowerCase().includes(t));
 $('#cn').textContent=L.length;
 $('#tb').innerHTML=L.map(l=>{const s=sla(l);return`<tr onclick="openLead('${l.id}')"><td><b>${h(l.nome_completo)}</b><br><small>${h(l.empresa)}</small></td><td>${svc(l)}</td><td>${st(l.pipeline_stage)}</td><td>${l.proprietario_id?h(own(l)):`<small title="Responsável por atribuir (Editar)">${h(l.proprietario||'—')}</small>`}</td><td>${s==null?'':s>24?`<span class="ch rd">${s}h</span>`:`<small>${s}h</small>`}</td><td>${wa(l.telefone_wa)}</td></tr>`}).join('')||'<tr><td colspan="6">Sem resultados.</td></tr>'}
function newLead(){
 modal('Novo lead',[
  {k:'nome_completo',l:'Nome completo',r:1},{k:'empresa',l:'Empresa',r:1},{k:'email',l:'Email',t:'email',r:1},{k:'telefone',l:'Telefone (+244 9XX XXX XXX)',r:1},
  {k:'origem',l:'Origem',t:'select',r:1,o:S.origens.map(o=>[o,o])},
  {k:'servicos',l:'Serviços de interesse (um ou mais)',t:'multi',r:1,o:S.servicos.map(s=>[s.id,s.nome])},
  {k:'prop',l:'Responsável',t:'select',r:1,o:S.users.map(u=>[u.id,u.full_name]),v:S.me.id},
  {k:'canal_preferido',l:'Canal preferido',t:'select',o:[['whatsapp','WhatsApp'],['telefone','Telefone'],['email','Email'],['presencial','Presencial']]},
  {k:'valor',l:'Valor estimado (Kz)',t:'number'}],
 async v=>{
  const d=await q(sb.rpc('verificar_duplicado',{p_email:v.email,p_telefone:v.telefone}));
  if(d.length&&!confirm('Possível duplicado: '+d.map(x=>x.nome+' ('+x.tipo+')').join(', ')+'. Criar mesmo assim?'))throw 0;
  const u=S.users.find(x=>x.id==v.prop);
  const l=await q(sb.from('leads').insert({nome_completo:v.nome_completo,empresa:v.empresa,email:v.email,telefone:v.telefone,origem:v.origem,servico_interesse:'',data_entrada:new Date().toISOString(),proprietario:u.role,proprietario_id:u.id,pipeline_stage:'Novo Lead',canal_preferido:v.canal_preferido,valor_estimado_kz:v.valor}).select('id').single());
  await q(sb.from('lead_servicos').insert(v.servicos.map(s=>({lead_id:l.id,servico_id:s}))));
  toast('Lead criado');viewLeads()})}
function drOpen(title,tabs,tab,fn,body){const d=$('#dr');d.style.display='block';
 d.innerHTML=`<button class="b g s" onclick="closeDr()" style="float:right">Fechar</button><h3 style="margin:0;color:var(--g)">${title}</h3><div class="tabs">${tabs.map(([k,t])=>`<button class="${k==tab?'on':''}" onclick="${fn}('${CUR.id}','${k}')">${t}</button>`).join('')}</div>${body}`}
const tl=(rows,f,e='Sem registos.')=>rows.length?rows.map(f).join(''):`<p><small>${e}</small></p>`;
async function openLead(id,tab='res'){CUR={id,tab};const l=S.leads.find(x=>x.id==id);let b='';
 if(tab=='res'){
  b=`<div class="kv"><span>Etapa</span><select onchange="setStage('${id}',this.value)">${ETAPAS.map(e=>`<option ${e==l.pipeline_stage?'selected':''}>${e}</option>`).join('')}</select>
  <span>Contacto</span><div>${h(l.email)}<br>${h(l.telefone)} ${wa(l.telefone_wa)}</div><span>Origem</span><div>${h(l.origem)}</div>
  <span>Responsável</span><div>${h(own(l))}</div><span>Valor estimado</span><div>${l.valor_estimado_kz?kz(l.valor_estimado_kz):'—'}</div>
  <span>1.ª resposta</span><div>${fd(l.primeira_resposta_em)}</div></div><b>Serviços</b><div>${(l.lead_servicos||[]).map(x=>`<span class="ch">${h(x.servicos?.nome)}</span>`).join('')||'—'}</div>
  <p><button class="b s g" onclick="addLeadSvc('${id}')">+ Serviço</button> <button class="b s g" onclick="newTask('lead_id','${id}')">+ Tarefa</button> <button class="b s g" onclick="editLead('${id}')">Editar</button> ${adm()?`<button class="b s g" style="color:var(--r)" onclick="delItem('leads','${id}')">Eliminar</button>`:''}</p>${l.cliente_id?'<p class="ch gr">Já é cliente</p>':''}`}
 if(tab=='act'){const r=await q(sb.from('atividades').select('*,users(full_name)').eq('lead_id',id).order('realizada_em',{ascending:false}));
  b=`<button class="b s" onclick="newAct('lead_id','${id}')">+ Registar contacto</button>`+tl(r,a=>`<div class="it"><span class="ch">${a.tipo}</span> <small>${fd(a.realizada_em)} · ${h(a.users?.full_name)}</small><br>${h(a.resumo)}</div>`)}
 if(tab=='reu'){b=await meetList('lead_id',id)}
 drOpen(h(l.nome_completo)+` <small>${h(l.empresa)}</small>`,[['res','Resumo'],['act','Contactos'],['reu','Reuniões']],tab,'openLead',b)}
async function setStage(id,v){const u={pipeline_stage:v};
 if(v=='Perdido'){const m=prompt('Motivo da perda?');if(!m)return openLead(id);u.motivo_perda=m}

function newCat(t){modal('Novo registo',[{k:'nome',l:'Nome',r:1}],async v=>{await q(sb.from(t).insert({nome:v.nome,ordem:100}));toast('Criado');await init()})}

/* ---------- eliminar / restaurar ---------- */
const arq=(t,R,f)=>R.map(r=>`<div class="it" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span>${h(f(r))}</span><span><button class="b s g" onclick="restItem('${t}','${r.id}')">Restaurar</button> <button class="b s g" style="color:var(--r)" onclick="purgeItem('${t}','${r.id}')">Apagar definitivamente</button></span></div>`).join('')||'<p><small>Vazio.</small></p>';
async function delItem(t,id){if(!confirm('Eliminar? Sai das listas, mas pode ser restaurado em Admin → Arquivo.'))return;
 await q(sb.from(t).update({deleted_at:new Date().toISOString()}).eq('id',id));toast('Eliminado (recuperável em Admin → Arquivo)');go(S.view)}
async function restItem(t,id){await q(sb.from(t).update({deleted_at:null}).eq('id',id));toast('Restaurado');viewAdmin()}
async function purgeItem(t,id){if(prompt('Apaga também notas, contactos, reuniões e histórico. Escreva APAGAR para confirmar.')!=='APAGAR')return;
 const r=await q(sb.from(t).delete().eq('id',id).select('id'));toast(r.length?'Apagado definitivamente':'Sem permissão para apagar',!r.length);viewAdmin()}
init();
</script></body></html>
